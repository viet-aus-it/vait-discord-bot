name: Build OzBargain referrals list

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build-referrals-list:
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    env:
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      AXIOM_DATASET: ${{ secrets.AXIOM_DATASET }}
      AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
      ENABLE_OTEL: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: https://us-east-1.aws.edge.axiom.co
      CLIENT_ID: blank
      TOKEN: blank

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up project
        uses: ./.github/actions/setup-node-deps

      - name: Build OzBargain referrals list
        run: pnpm run build:referrals
        env:
          NODE_ENV: production
          DATABASE_URL: blank

      - name: Setup Git Credentials
        run: |
          git config --global user.email "admin@vait.au"
          git config --global user.name "VAIT Admin (Github Actions)"

      - name: Compare changes and create PR if succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -b autoupdate/referrals
          pnpm run lint:fix && pnpm run format

          if [[ `git status --porcelain` ]]; then
            # --- changes detected.
            echo "DETECTED CHANGES IN OZBARGAIN SERVICE LIST. BUILDING PR."
            cp .env.ci .env
            npx dotenvx run -- npx vitest run -u
            git add src/slash-commands/referral
            git commit -m "chore: update ozbargain referrals list"
            git push -f -u origin autoupdate/referrals
            gh pr create --title "chore: update ozbargain referrals list" --body "this is generated via build-ozbargain-referrals-list.yml" --base master --head autoupdate/referrals
          else
            # --- no changes detected.
            echo "NO CHANGES TO REPORT. EXITING."
          fi
